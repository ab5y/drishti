name: Release APK

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']   # release tags only; the build step checks again

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # app/build.gradle.kts stamps the git hash of docs/decisions.md

      # AGP 9.4.1 needs JDK 17 or newer to run.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set"; exit 1; fi
          done

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TAG_RE='^v([0-9]+)\.([0-9]+)\.([0-9]+)$'
          if [[ ! "$GITHUB_REF_NAME" =~ $TAG_RE ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH (e.g. v0.1.0); cannot derive versionCode"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          # Longer than 9 digits would overflow the arithmetic below and is over every limit anyway.
          for part in "${BASH_REMATCH[@]:1}"; do
            if (( ${#part} > 9 )); then
              echo "::error::Tag '$GITHUB_REF_NAME' has a number that is too large ($part)"
              exit 1
            fi
          done
          # 10# keeps "08" decimal.
          MAJOR=$(( 10#${BASH_REMATCH[1]} )); MINOR=$(( 10#${BASH_REMATCH[2]} )); PATCH=$(( 10#${BASH_REMATCH[3]} ))
          if (( MINOR >= 100 || PATCH >= 100 )); then
            echo "::error::Tag '$GITHUB_REF_NAME': MINOR and PATCH must be 0-99, or versionCode = MAJOR*10000 + MINOR*100 + PATCH collides with another version"
            exit 1
          fi
          if (( MAJOR > 209999 )); then
            echo "::error::Tag '$GITHUB_REF_NAME': MAJOR must be at most 209999 so versionCode stays within Android's 2100000000 limit"
            exit 1
          fi
          # versionCode = MAJOR*10000 + MINOR*100 + PATCH (v0.1.0 -> 100, v1.2.3 -> 10203).
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "versionName=$VERSION versionCode=$VERSION_CODE"
          ./gradlew assembleRelease \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$VERSION_CODE"

      # Signed output is app-release.apk; without a signing config AGP writes app-release-unsigned.apk.
      - name: Stage stable-named APK and checksum
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then echo "::error::$APK not found - signing did not apply"; ls app/build/outputs/apk/release/; exit 1; fi
          cp "$APK" drishti.apk
          sha256sum drishti.apk > drishti.apk.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" drishti.apk drishti.apk.sha256 --generate-notes
